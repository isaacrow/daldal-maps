# Builds the offline map, routing graph and search index for every Iraqi city in cities.json,
# from OpenStreetMap data, and publishes them as the latest release.
name: Build city maps

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "City ids to build, space-separated (empty = all)"
        required: false
        default: ""
  schedule:
    - cron: "0 1 * * 1" # Every Monday: fresh OpenStreetMap edits.
  push:
    branches: [main]
    paths: [cities.json, scripts/**, .github/workflows/build-maps.yml]

permissions:
  contents: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install --quiet osmium

      - name: Iraq OpenStreetMap extract (Geofabrik)
        run: |
          mkdir -p work
          curl -fsSL -o work/iraq.osm.pbf https://download.geofabrik.de/asia/iraq-latest.osm.pbf
          ls -lh work/iraq.osm.pbf

      - name: Foursquare Open Source Places (Apache 2.0)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "No HF_TOKEN secret: building without Foursquare places"; exit 0; fi
          pip install --quiet duckdb
          python3 -X utf8 scripts/fetch_foursquare.py work/fsq-iraq.parquet || echo "::warning::Foursquare download failed"
          [ -s work/fsq-iraq.parquet ] && curl -fsSL -o out-fsq-NOTICE.txt https://fsq-os-places-us-east-1.s3.amazonaws.com/NOTICE.txt || true

      - name: Build cities
        env:
          ONLY: ${{ github.event.inputs.cities }}
        run: |
          mkdir -p out
          [ -s out-fsq-NOTICE.txt ] && mv out-fsq-NOTICE.txt out/FOURSQUARE-NOTICE.txt
          python3 -c "import json; [print(c['id'], ','.join(map(str, c['bbox']))) for c in json.load(open('cities.json', encoding='utf-8'))]" > list.txt
          while read -r id bbox; do
            if [ -n "$ONLY" ] && ! echo " $ONLY " | grep -q " $id "; then continue; fi
            sh scripts/build_city.sh "$id" "$bbox" work/iraq.osm.pbf out || echo "::warning::$id failed"
          done < list.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="maps-$(date -u +%Y%m%d)-${{ github.run_number }}"
          python3 scripts/write_catalog.py cities.json out "${{ github.repository }}" "$TAG"
          gh release create "$TAG" out/* --title "City maps $(date -u +%Y-%m-%d)" --latest \
            --notes "Offline maps, routing and search for Iraqi cities. Data © OpenStreetMap contributors (ODbL)."
